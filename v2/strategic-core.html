(function () {
  const grid = document.getElementById('outletGrid');
  const search = document.getElementById('mainSearch');
  const sel = { reg: new Set(), chan: new Set(), typ: new Set() };
  const field = { reg: 'region', chan: 'channel', typ: 'tier' };
  const lists = {
    reg: [...new Set(storeList.map(s => s.region))].sort(),
    chan: [...new Set(storeList.map(s => s.channel))].sort(),
    typ: ['Platinum', 'Gold', 'Silver', 'Bronze', 'Others']
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function chips(cat, boxId) {
    const box = document.getElementById(boxId);
    const n = v => storeList.filter(s => s[field[cat]] === v).length;
    box.innerHTML = `<button type="button" class="chip" data-v="" aria-pressed="true">All (${storeList.length})</button>` +
      lists[cat].map(v => `<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="false">${esc(v)} (${n(v)})</button>`).join('');
    box.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      const v = b.dataset.v;
      if (!v) sel[cat].clear(); else sel[cat].has(v) ? sel[cat].delete(v) : sel[cat].add(v);
      box.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.v ? String(sel[cat].has(c.dataset.v)) : String(sel[cat].size === 0)));
      apply();
    });
  }

  function apply() {
    const q = search.value.toLowerCase();
    const rows = storeList.filter(s =>
      (s.name.toLowerCase().includes(q) || s.region.toLowerCase().includes(q) || s.seller.toLowerCase().includes(q)) &&
      (!sel.reg.size || sel.reg.has(s.region)) && (!sel.chan.size || sel.chan.has(s.channel)) && (!sel.typ.size || sel.typ.has(s.tier)));
    grid.innerHTML = rows.length ? rows.map((s, i) => `
      <button type="button" class="outlet t-${(s.tier || 'others').toLowerCase()}" data-i="${storeList.indexOf(s)}">
        <span class="tier">${esc(s.tier)}</span>
        <h3>${esc(s.name)}</h3>
        <small>P6M avg revenue as per Lindt</small>
        <span class="rev">${esc(s.sales)}</span>
        <small>${esc(s.region)} · ${esc(s.channel)}</small>
      </button>`).join('') : '<div class="card muted">No outlets match. Clear a filter or the search.</div>';
    document.getElementById('shopCount').textContent = rows.length + (rows.length === 1 ? ' shop' : ' shops');
  }

  grid.addEventListener('click', e => {
    const b = e.target.closest('.outlet'); if (!b) return;
    const s = storeList[+b.dataset.i];
    document.getElementById('mName').textContent = s.fullName;
    document.getElementById('mType').textContent = s.tier;
    document.getElementById('mTotal').textContent = s.sales;
    document.getElementById('modalDetails').innerHTML = [['Region', s.region], ['Partner', s.channel], ['Seller', s.seller]]
      .map(d => `<dt>${d[0]}</dt><dd>${esc(d[1])}</dd>`).join('');
    document.getElementById('mTableBody').innerHTML = Object.entries(s.monthly)
      .map(([m, v]) => `<tr><td>${esc(m)}</td><td class="num">${esc(v)}</td></tr>`).join('');
    document.getElementById('outletModal').classList.add('open');
  });

  document.getElementById('resetAll').onclick = () => {
    search.value = ''; Object.values(sel).forEach(s => s.clear());
    document.querySelectorAll('.filters .chip').forEach(c => c.setAttribute('aria-pressed', String(!c.dataset.v)));
    apply();
  };
  search.addEventListener('input', apply);
  chips('reg', 'regionChips'); chips('chan', 'channelChips'); chips('typ', 'typeChips');
  apply();
})();
</script>
