<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Oli-Ohh Command Center</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7f1d1d">
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/v2.css">
<script src="assets/v2.js"></script>
<style>
  body { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(380px, .85fr); background: var(--surface); }
  .film { position: relative; overflow: hidden; background: var(--maroon) url(../assets/login-poster.jpg) center/cover; }
  .film video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .film::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(127,29,29,0) 40%, rgba(94,20,20,.85) 100%); }
  .film-copy { position: absolute; left: 48px; right: 48px; bottom: 44px; z-index: 1; color: #fff; }
  .film-copy b { display: block; font: 800 clamp(3rem, 7vw, 6.5rem)/.9 var(--display); font-variation-settings: "opsz" 96; letter-spacing: -.035em; }
  .film-copy span { display: block; margin-top: 14px; font-size: var(--fs-md); opacity: .85; max-width: 36ch; }

  .gate { display: flex; flex-direction: column; justify-content: center; padding: 48px clamp(28px, 6vw, 72px); }
  .gate img { width: 88px; height: 88px; object-fit: contain; margin-bottom: 26px; }
  .gate h1 { font-size: var(--fs-3xl); font-variation-settings: "opsz" 96; letter-spacing: -.03em; }
  .gate .sub { color: var(--muted); margin-top: 6px; }
  .pins { display: flex; gap: 12px; margin: 30px 0 18px; }
  .pin { width: 64px; height: 76px; border: 1.5px solid var(--line-strong); border-radius: 14px; background: var(--surface);
         text-align: center; font: 700 2rem var(--display); color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
  .pin:focus { border-color: var(--maroon); box-shadow: 0 0 0 4px var(--maroon-tint); }
  .pin.bad { border-color: var(--pomodoro); }
  .gate .btn { width: 100%; max-width: 292px; padding: 14px 18px; font-size: var(--fs-base); }
  .msg { min-height: 1.4em; margin-top: 12px; font-size: var(--fs-sm); font-weight: 600; color: var(--pomodoro); }
  .msg.ok { color: var(--basil); }
  .linkbtn { background: none; border: 0; padding: 0; margin-top: 22px; color: var(--muted); font-size: var(--fs-sm); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; align-self: flex-start; }
  .linkbtn:hover { color: var(--maroon); }
  #resetView { display: none; max-width: 292px; margin-top: 26px; gap: 12px; flex-direction: column; }
  .shake { animation: shake .3s; }
  @keyframes shake { 33% { transform: translateX(-8px); } 66% { transform: translateX(8px); } }
  .leaving { opacity: 0; transform: translateY(-8px); transition: .35s var(--ease); }

  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-rows: 38vh auto; }
    .film-copy { left: 22px; right: 22px; bottom: 22px; }
    .film-copy b { font-size: 3.2rem; }
    .film-copy span { display: none; }
    .gate { padding: 28px 22px 40px; justify-content: flex-start; }
    .gate img { display: none; }
    .gate h1 { font-size: var(--fs-2xl); }
    .pin { width: 58px; height: 68px; }
  }
  @media (prefers-reduced-motion: reduce) { .film video { display: none; } }
</style>
</head>
<body>
  <section class="film" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto" poster="../assets/login-poster.jpg">
      <source src="../assets/login-bg.mp4" type="video/mp4">
    </video>
    <div class="film-copy"><b>Oli-Ohh</b><span>Suji pasta kit. No maida, no palm oil, not fried.</span></div>
  </section>

  <main class="gate" id="card">
    <img src="../assets/logo.png" alt="Oli-Ohh">
    <h1 id="titleText">Hi Akshay</h1>
    <p class="sub" id="subText">Enter your 4-digit PIN to open the Command Center.</p>

    <div id="loginView">
      <div class="pins" role="group" aria-label="PIN">
        <input class="pin" type="password" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="PIN digit 1" autofocus>
        <input class="pin" type="password" inputmode="numeric" maxlength="1" aria-label="PIN digit 2">
        <input class="pin" type="password" inputmode="numeric" maxlength="1" aria-label="PIN digit 3">
        <input class="pin" type="password" inputmode="numeric" maxlength="1" aria-label="PIN digit 4">
      </div>
      <button class="btn" type="button" onclick="validateAccess()">Open dashboard</button>
      <p class="msg" id="loginMsg" role="status" aria-live="polite"></p>
      <button class="linkbtn" type="button" onclick="toggleView('reset')">Change PIN</button>
    </div>

    <div id="resetView">
      <label class="field">Current PIN<input type="password" inputmode="numeric" maxlength="4" autocomplete="off" id="oldPin"></label>
      <label class="field">New PIN<input type="password" inputmode="numeric" maxlength="4" autocomplete="off" id="newPin"></label>
      <label class="field">Confirm new PIN<input type="password" inputmode="numeric" maxlength="4" autocomplete="off" id="confirmPin"></label>
      <button class="btn" type="button" onclick="handlePinUpdate()">Save new PIN</button>
      <p class="msg" id="resetMsg" role="status" aria-live="polite"></p>
      <button class="linkbtn" type="button" onclick="toggleView('login')">Back to sign in</button>
    </div>
  </main>

<script>
  const boxes = document.querySelectorAll('.pin');
  const card = document.getElementById('card');
  const loginMsg = document.getElementById('loginMsg');
  const resetMsg = document.getElementById('resetMsg');

  // Opening the sign-in screen ends any session (= logout)
  try { sessionStorage.removeItem('oliohh_auth'); } catch (e) {}

  // Salted SHA-256 hashes — same PINs as the original dashboard
  const MASTER_HASH = '53f422d01b20f821e3b8e2373363f49c2d83ef2bec96d65c6e08fa9115eb7fd4';
  const DEFAULT_USER_HASH = 'd4a99c82b3ee2cab27096516c84b2c85b93805464d9b646d55a5e792af4ffa3b';
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  async function hashPin(pin) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('oliohh:' + pin));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  (async () => {
    const legacy = store('akshay_pin');
    if (legacy && !store('akshay_pin_hash')) { store('akshay_pin_hash', await hashPin(legacy)); try { localStorage.removeItem('akshay_pin'); } catch (e) {} }
  })();
  const userHash = () => store('akshay_pin_hash') || DEFAULT_USER_HASH;
  async function isValid(pin) { const h = await hashPin(pin); return h === MASTER_HASH || h === userHash(); }
  function nextPage() {
    const n = new URLSearchParams(location.search).get('next') || '';
    return /^[a-z0-9._-]+\.html([?#].*)?$/i.test(n) && !/^index\.html/i.test(n) ? n : 'home.html';
  }

  boxes.forEach((box, i) => {
    box.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(-1);
      if (e.target.value && i < boxes.length - 1) boxes[i + 1].focus();
      loginMsg.textContent = '';
      if (Array.from(boxes).every(b => b.value)) setTimeout(validateAccess, 120);
    });
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value && i > 0) boxes[i - 1].focus();
      if (e.key === 'Enter') validateAccess();
    });
    box.addEventListener('paste', (e) => {
      const d = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4);
      if (!d) return; e.preventDefault();
      boxes.forEach((b, j) => b.value = d[j] || '');
      boxes[Math.min(d.length, 3)].focus();
      if (d.length === 4) validateAccess();
    });
  });

  let busy = false;
  async function validateAccess() {
    if (busy) return;
    const pin = Array.from(boxes).map(b => b.value).join('');
    if (pin.length < 4) { loginMsg.textContent = 'Enter all 4 digits.'; return; }
    busy = true;
    if (await isValid(pin)) {
      try { sessionStorage.setItem('oliohh_auth', '1'); } catch (e) {}
      card.classList.add('leaving');
      setTimeout(() => location.replace(nextPage()), 320);
    } else {
      loginMsg.textContent = 'That PIN didn’t match. Try again.';
      card.classList.add('shake');
      if (navigator.vibrate) navigator.vibrate(80);
      boxes.forEach(b => { b.value = ''; b.classList.add('bad'); });
      setTimeout(() => { card.classList.remove('shake'); boxes.forEach(b => b.classList.remove('bad')); boxes[0].focus(); busy = false; }, 320);
    }
  }

  function toggleView(view) {
    const reset = view === 'reset';
    document.getElementById('loginView').style.display = reset ? 'none' : 'block';
    document.getElementById('resetView').style.display = reset ? 'flex' : 'none';
    document.getElementById('titleText').textContent = reset ? 'Change PIN' : 'Hi Akshay';
    document.getElementById('subText').textContent = reset ? 'The new PIN is saved on this device only.' : 'Enter your 4-digit PIN to open the Command Center.';
    loginMsg.textContent = ''; resetMsg.textContent = ''; resetMsg.className = 'msg';
    (reset ? document.getElementById('oldPin') : boxes[0]).focus();
  }

  async function handlePinUpdate() {
    const o = document.getElementById('oldPin').value, n = document.getElementById('newPin').value, c = document.getElementById('confirmPin').value;
    resetMsg.className = 'msg';
    if (!(await isValid(o))) { resetMsg.textContent = 'Current PIN is incorrect.'; return; }
    if (!/^\d{4}$/.test(n)) { resetMsg.textContent = 'New PIN must be exactly 4 digits.'; return; }
    if (n !== c) { resetMsg.textContent = 'The two new PINs don’t match.'; return; }
    store('akshay_pin_hash', await hashPin(n));
    ['oldPin', 'newPin', 'confirmPin'].forEach(id => document.getElementById(id).value = '');
    resetMsg.className = 'msg ok'; resetMsg.textContent = 'PIN saved.';
    setTimeout(() => toggleView('login'), 1100);
  }
  document.getElementById('resetView').addEventListener('keydown', e => { if (e.key === 'Enter') handlePinUpdate(); });
</script>
</body>
</html>
