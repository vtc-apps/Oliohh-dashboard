<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggestion Center</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Arial;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
width:min(450px, 92vw);
background:rgba(255,255,255,0.08);
padding:40px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
text-align:center;
}

h1{
margin-bottom:25px;
}

input, textarea{

width:100%;
padding:12px;
margin-top:12px;
border-radius:8px;
border:none;
font-size:15px;
}

textarea{
height:140px;
resize:none;
}

button{

margin-top:20px;
padding:12px 25px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
font-weight:bold;
}

.submit-btn{

background:linear-gradient(135deg,#00c6ff,#0072ff);
color:white;
}

.submit-btn:hover{

transform:scale(1.05);
box-shadow:0 0 15px #00ffd5;
}

.back-btn{

display:inline-block;
padding:10px 22px;
border-radius:8px;
text-decoration:none;
margin-top:15px;
background:transparent;
border:2px solid #00ffd5;
color:#00ffd5;
}

.back-btn:hover{

background:#00ffd5;
color:black;
}

#msg{

margin-top:15px;
font-size:14px;
color:#00ffd5;
}

</style>
    <!-- oo-shell -->
    <meta name="theme-color" content="#05080a">
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="assets/app.css">
    <script src="assets/app.js" defer></script>
    <!-- /oo-shell -->
</head>

<body>


<div class="container">

<h1>💡 Submit Your Suggestion</h1>

<input type="text" id="name" autocomplete="name" aria-label="Your name" placeholder="Your Name">

<textarea id="suggestion" aria-label="Your suggestion" placeholder="Write your suggestion for the Oli-Ohh Launch..."></textarea>

<button class="submit-btn" onclick="submitSuggestion()">Submit Suggestion</button>

<br>

<a href="home.html" class="back-btn">← Back to Dashboard</a>

<p id="msg" role="status" aria-live="polite"></p>

</div>

<script>
// Google Apps Script WEB APP url (Deploy → New deployment → Web app → copy the URL ending in /exec)
const SUGGESTION_ENDPOINT = "https://script.google.com/macros/library/d/1EP4e0k6YVseXh1wEBq6qmsn8WBKvoGnu7JkGKbLKxfGOQEn4qtvatmOf/2";

function setMsg(t){ document.getElementById("msg").textContent = t; }

function submitSuggestion(){
  const nameEl = document.getElementById("name");
  const textEl = document.getElementById("suggestion");
  const btn = document.querySelector(".submit-btn");
  const name = nameEl.value.trim();
  const suggestion = textEl.value.trim();

  if (!name || !suggestion) { setMsg("⚠ Please fill all fields"); return; }
  if (!/\/exec(\?|$)/.test(SUGGESTION_ENDPOINT)) {
    setMsg("⚠ Suggestion box isn't connected yet — the form needs the Apps Script web-app (/exec) link.");
    return;
  }

  btn.disabled = true; btn.textContent = "Sending…";
  // Apps Script doesn't send CORS headers, so post as a simple no-cors request
  fetch(SUGGESTION_ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ name, suggestion, page: "Oli-Ohh Command Center", at: new Date().toISOString() })
  })
  .then(() => { setMsg("✅ Suggestion submitted — thank you!"); nameEl.value = ""; textEl.value = ""; })
  .catch(() => setMsg("⚠ Couldn't send — check your connection and try again"))
  .finally(() => { btn.disabled = false; btn.textContent = "Submit Suggestion"; });
}
</script>

</body>
</html>
