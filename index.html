<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oli-Ohh | Secure Access</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-cyan: #00ffd5;
            --ios-blue: #007AFF;
            --ios-red: #ff3b30;
            --spring: cubic-bezier(0.16, 1, 0.3, 1);
            
            /* High-Performance Glass (Optimized for TV) */
            --glass: rgba(15, 20, 25, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: white;
            --text-sub: rgba(255, 255, 255, 0.4);
            --overlay: rgba(0, 0, 0, 0.6);
            --pin-bg: rgba(255, 255, 255, 0.05);
            --btn-bg: var(--ios-cyan);
            --btn-text: black;
            --text-glow: 0 0 15px rgba(0, 255, 213, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; cursor: default; }

        body {
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        /* Hardware Accelerated Video BG */
        .video-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            object-fit: cover;
            will-change: transform;
            transform: translateZ(0); 
        }

        .theme-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--overlay);
            z-index: -1;
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 40px; padding: 50px 40px;
            width: 90%; max-width: 440px; text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: entrance 1s var(--spring) forwards;
            transform: translateZ(0); 
        }

        @keyframes entrance { 
            from { opacity: 0; transform: scale(0.96) translateY(20px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }

        .hi-akshay {
            font-size: 3rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 8px;
            color: var(--text-main);
            text-shadow: var(--text-glow);
        }

        .status-label { 
            font-size: 0.75rem; font-weight: 700; 
            color: var(--text-sub); 
            text-transform: uppercase; letter-spacing: 3px; 
        }

        /* PIN Inputs */
        .pin-wrapper { display: flex; justify-content: center; gap: 12px; margin: 35px 0; }
        .pin-box {
            width: 55px; height: 75px; 
            background: var(--pin-bg);
            border: 2px solid transparent; 
            border-radius: 18px;
            font-size: 2rem; font-weight: 700; color: var(--text-main); 
            text-align: center; outline: none; 
            transition: 0.2s var(--spring);
        }
        .pin-box:focus { border-color: var(--ios-cyan); transform: scale(1.05) translateY(-3px); }

        /* Reset View Container */
        .reset-container { display: none; flex-direction: column; gap: 12px; margin-top: 20px; }
        .input-field {
            background: rgba(255, 255, 255, 0.07); border: 1px solid var(--glass-border);
            border-radius: 15px; padding: 15px; color: white; font-size: 1rem; text-align: center; outline: none;
        }

        .unlock-btn {
            background: var(--btn-bg); color: var(--btn-text); border: none; 
            padding: 18px 40px; border-radius: 20px;
            font-weight: 800; font-size: 0.9rem; 
            text-transform: uppercase; letter-spacing: 1.5px;
            cursor: pointer; width: 100%; transition: 0.3s var(--spring);
        }
        .unlock-btn:hover { transform: scale(1.02); background: #fff; color: #000; }

        .reset-link {
            margin-top: 25px; font-size: 0.7rem; color: var(--text-sub); 
            letter-spacing: 1px; cursor: pointer; transition: 0.3s;
        }
        .reset-link:hover { color: var(--ios-cyan); }
        button.reset-link { background: none; border: 0; display: block; margin-left: auto; margin-right: auto; font-family: inherit; font-weight: 600; }
        .form-msg { min-height: 1.2em; margin-top: 14px; font-size: 0.78rem; font-weight: 600; color: var(--ios-red); letter-spacing: .3px; }
        .form-msg.ok { color: var(--ios-cyan); }
        @media (max-width: 420px) {
            .login-card { padding: 40px 22px; border-radius: 30px; }
            .hi-akshay { font-size: 2.4rem; }
            .pin-box { width: 52px; height: 66px; }
        }
        @media (prefers-reduced-motion: reduce) { .video-bg { display: none; } body { background: #000 url(assets/login-poster.jpg) center/cover; } }

        .shake { animation: hapticShake 0.3s ease-in-out; }
        @keyframes hapticShake { 0%, 100% { transform: translateX(0); } 33% { transform: translateX(-8px); } 66% { transform: translateX(8px); } }

        .success-exit { opacity: 0; transform: scale(0.95) translateY(-20px); transition: 0.5s ease-in forwards; }
    </style>
    <!-- oo-shell -->
    <meta name="theme-color" content="#05080a">
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="assets/app.css">
    <script src="assets/app.js" defer></script>
    <!-- /oo-shell -->
</head>
<body>

    <video autoplay muted loop playsinline preload="auto" poster="assets/login-poster.jpg" class="video-bg" aria-hidden="true">
        <source src="assets/login-bg.mp4" type="video/mp4">
    </video>
    <div class="theme-overlay"></div>

    <div class="login-card" id="loginCard">
        <h1 class="hi-akshay" id="titleText">Hi Akshay</h1>
        <p class="status-label" id="statusText">Authentication Required</p>

        <!-- LOGIN VIEW -->
        <div id="loginView">
            <div class="pin-wrapper">
                <input type="password" inputmode="numeric" maxlength="1" class="pin-box" aria-label="PIN digit 1" autocomplete="one-time-code" autofocus>
                <input type="password" inputmode="numeric" maxlength="1" class="pin-box">
                <input type="password" inputmode="numeric" maxlength="1" class="pin-box">
                <input type="password" inputmode="numeric" maxlength="1" class="pin-box">
            </div>
            <button class="unlock-btn" onclick="validateAccess()">Unlock Dashboard</button>
            <p class="form-msg" id="loginMsg" role="status" aria-live="polite"></p>
            <button type="button" class="reset-link" onclick="toggleView('reset')">SETTINGS / RESET PIN</button>
        </div>

        <!-- RESET VIEW -->
        <div id="resetView" class="reset-container">
            <input type="password" inputmode="numeric" maxlength="4" autocomplete="off" id="oldPin" class="input-field" placeholder="Verify Current User PIN">
            <input type="password" inputmode="numeric" maxlength="4" autocomplete="off" id="newPin" class="input-field" placeholder="New 4-Digit PIN">
            <input type="password" inputmode="numeric" maxlength="4" autocomplete="off" id="confirmPin" class="input-field" placeholder="Confirm New PIN">
            <button class="unlock-btn" style="margin-top: 10px;" onclick="handlePinUpdate()">Update PIN</button>
            <p class="form-msg" id="resetMsg" role="status" aria-live="polite"></p>
            <button type="button" class="reset-link" onclick="toggleView('login')">BACK TO LOGIN</button>
        </div>
    </div>

    <script>
        const boxes = document.querySelectorAll('.pin-box');
        const card = document.getElementById('loginCard');
        const loginMsg = document.getElementById('loginMsg');
        const resetMsg = document.getElementById('resetMsg');

        // Opening the login screen always ends any existing session (= logout)
        try { sessionStorage.removeItem('oliohh_auth'); } catch (e) {}

        // --- PIN CONFIGURATION ---------------------------------------------
        // PINs are stored as salted SHA-256 hashes, never in plain text.
        // Master PIN hash (static). Akshay's PIN defaults to the second hash
        // and can be changed from Settings (kept on this device only).
        const MASTER_HASH = '53f422d01b20f821e3b8e2373363f49c2d83ef2bec96d65c6e08fa9115eb7fd4';
        const DEFAULT_USER_HASH = 'd4a99c82b3ee2cab27096516c84b2c85b93805464d9b646d55a5e792af4ffa3b';

        function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

        // Migrate an old plain-text PIN saved by the previous version
        (async () => {
            const legacy = store('akshay_pin');
            if (legacy && !store('akshay_pin_hash')) {
                store('akshay_pin_hash', await hashPin(legacy));
                try { localStorage.removeItem('akshay_pin'); } catch (e) {}
            }
        })();

        async function hashPin(pin) {
            const data = new TextEncoder().encode('oliohh:' + pin);
            const buf = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        const userHash = () => store('akshay_pin_hash') || DEFAULT_USER_HASH;
        async function isValid(pin) { const h = await hashPin(pin); return h === MASTER_HASH || h === userHash(); }

        function nextPage() {
            const n = new URLSearchParams(location.search).get('next') || '';
            // only allow local dashboard pages
            return /^[a-z0-9._-]+\.html([?#].*)?$/i.test(n) && !/^(index|login)\.html/i.test(n) ? n : 'home.html';
        }

        // Auto-advance, paste support and auto-submit
        boxes.forEach((box, i) => {
            box.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/\D/g, '').slice(-1);
                if (e.target.value && i < boxes.length - 1) boxes[i + 1].focus();
                loginMsg.textContent = '';
                if (Array.from(boxes).every(b => b.value)) setTimeout(validateAccess, 150);
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) boxes[i - 1].focus();
                if (e.key === 'Enter') validateAccess();
            });
            box.addEventListener('paste', (e) => {
                const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4);
                if (!digits) return;
                e.preventDefault();
                boxes.forEach((b, j) => b.value = digits[j] || '');
                boxes[Math.min(digits.length, 3)].focus();
                if (digits.length === 4) validateAccess();
            });
            if (i) box.setAttribute('aria-label', 'PIN digit ' + (i + 1));
        });

        let busy = false;
        async function validateAccess() {
            if (busy) return;
            const enteredPin = Array.from(boxes).map(b => b.value).join('');
            if (enteredPin.length < 4) { loginMsg.textContent = 'Enter all 4 digits'; return; }
            busy = true;
            if (await isValid(enteredPin)) {
                try { sessionStorage.setItem('oliohh_auth', '1'); } catch (e) {}
                card.classList.add('success-exit');
                setTimeout(() => { window.location.replace(nextPage()); }, 450);
            } else {
                loginMsg.textContent = 'Incorrect PIN — try again';
                card.classList.add('shake');
                if (navigator.vibrate) navigator.vibrate(80);
                boxes.forEach(b => { b.value = ''; b.style.borderColor = 'var(--ios-red)'; });
                setTimeout(() => {
                    card.classList.remove('shake');
                    boxes.forEach(b => b.style.borderColor = '');
                    boxes[0].focus();
                    busy = false;
                }, 300);
            }
        }

        function toggleView(view) {
            const loginView = document.getElementById('loginView');
            const resetView = document.getElementById('resetView');
            const title = document.getElementById('titleText');
            loginMsg.textContent = ''; resetMsg.textContent = ''; resetMsg.className = 'form-msg';
            if (view === 'reset') {
                loginView.style.display = 'none';
                resetView.style.display = 'flex';
                title.innerText = 'Settings';
                document.getElementById('oldPin').focus();
            } else {
                loginView.style.display = 'block';
                resetView.style.display = 'none';
                title.innerText = 'Hi Akshay';
                boxes[0].focus();
            }
        }

        async function handlePinUpdate() {
            const oldVal = document.getElementById('oldPin').value;
            const newVal = document.getElementById('newPin').value;
            const confVal = document.getElementById('confirmPin').value;
            resetMsg.className = 'form-msg';

            if (!(await isValid(oldVal))) { resetMsg.textContent = 'Current PIN is incorrect'; return; }
            if (!/^\d{4}$/.test(newVal)) { resetMsg.textContent = 'New PIN must be exactly 4 digits'; return; }
            if (newVal !== confVal) { resetMsg.textContent = "New PINs don't match"; return; }

            store('akshay_pin_hash', await hashPin(newVal));
            ['oldPin', 'newPin', 'confirmPin'].forEach(id => document.getElementById(id).value = '');
            resetMsg.className = 'form-msg ok';
            resetMsg.textContent = 'PIN updated on this device ✓';
            setTimeout(() => toggleView('login'), 1200);
        }
        document.getElementById('resetView').addEventListener('keydown', e => { if (e.key === 'Enter') handlePinUpdate(); });
    </script>
    </body>
</html>
